name: Daily Coffee Shop ETL Pipeline

on:
  # Runs every day at 06:00 UTC (cron schedule)
  schedule:
    - cron: '0 6 * * *'
  # Allows you to trigger the pipeline manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code from your repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install required packages
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run your ETL script
      - name: Execute ETL Pipeline
        run: python etl.py

      # 5. Commit and save generated files (SQLite DB and summary CSV)
      - name: Commit and Push Generated Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add coffee_shop.db daily_summary.csv
          git commit -m "Auto: Update daily summary and database [skip ci]" || echo "No changes to commit"
          git push